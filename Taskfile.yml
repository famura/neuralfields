version: '3'

vars:
  UV_RUN: uv run --locked
  PYTHON_FILES:
    sh: find . -type f -name '*.py' -not -path './.git/*' -not -path './.venv/*'
  LINT_FILES: '{{.LINT_FILES | default "neuralfields"}}'
  REPORTDIR: '{{.REPORTDIR | default ".linting_reports"}}'
  PART: '{{.PART | default "minor"}}'

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list

  sync:
    desc: Install runtime and development dependencies
    cmds:
      - uv sync --locked

  hooks:
    desc: Install pre-commit hooks
    cmds:
      - '{{.UV_RUN}} pre-commit install'

  format:
    desc: Format Python files
    cmds:
      - '{{.UV_RUN}} black {{.PYTHON_FILES}}'
      - '{{.UV_RUN}} isort --color {{.PYTHON_FILES}}'
      - '{{.UV_RUN}} pyupgrade --py310-plus {{.PYTHON_FILES}}'
      - '{{.UV_RUN}} autoflake --in-place {{.PYTHON_FILES}}'

  format:check:
    desc: Check Black, isort, and autoflake without modifying files
    cmds:
      - '{{.UV_RUN}} black --check --diff {{.PYTHON_FILES}}'
      - '{{.UV_RUN}} isort --color --check --diff {{.PYTHON_FILES}}'
      - '{{.UV_RUN}} autoflake --check-diff {{.PYTHON_FILES}}'

  lint:
    desc: Write mypy, pylint, and bandit reports
    cmds:
      - mkdir -p {{.REPORTDIR}}
      - '{{.UV_RUN}} mypy {{.LINT_FILES}} --config-file=pyproject.toml --txt-report={{.REPORTDIR}} > {{.REPORTDIR}}/mypy_report.txt || true'
      - '{{.UV_RUN}} pylint {{.LINT_FILES}} --rcfile=pyproject.toml --exit-zero --output={{.REPORTDIR}}/pylint_report.txt'
      - '{{.UV_RUN}} bandit --configfile=pyproject.toml --severity-level=medium --recursive --exit-zero --format=txt --output={{.REPORTDIR}}/bandit_report.txt {{.LINT_FILES}}'

  test:
    desc: Run tests and generate coverage reports
    cmds:
      - '{{.UV_RUN}} coverage run -m pytest --exitfirst'
      - '{{.UV_RUN}} coverage xml'
      - '{{.UV_RUN}} coverage html --directory docs/exported/coverage'
      - mv docs/exported/coverage/index.html docs/exported/coverage/report.html
      - '{{.UV_RUN}} coverage report'

  clean:
    desc: Remove generated files
    cmds:
      - find . -type d -name __pycache__ -prune -exec rm -rf {} +
      - rm -rf .coverage .linting_reports .mypy_cache .pytest_cache .site coverage.xml dist docs/exported docs/index.md pytest.xml

  _export-docs-artifacts:
    internal: true
    cmds:
      - '{{.UV_RUN}} git-changelog . --output docs/exported/changelog.md --style conventional --template angular'
      - '{{.UV_RUN}} genbadge coverage --input-file coverage.xml --output-file docs/exported/coverage/badge.svg'
      - '{{.UV_RUN}} genbadge tests --input-file pytest.xml --output-file docs/exported/tests/badge.svg'
      - '{{.UV_RUN}} pip-licenses --format markdown --with-authors --with-urls --with-description --output-file docs/exported/third_party_licenses.md'
      - mkdir -p docs/exported/examples
      - cp examples/time_series_learning.png docs/exported/examples/time_series_learning.png
      - cp examples/time_series_generation.png docs/exported/examples/time_series_generation.png
      - task --list-all > docs/exported/task_options.txt

  docs:
    desc: Build the documentation
    cmds:
      - task: _export-docs-artifacts
      - '{{.UV_RUN}} mkdocs build'

  bump-version-tag:
    desc: Create a new version tag
    vars:
      RELEASE: '{{.RELEASE | default "false"}}'
    cmds:
      - |
        set -eu
        git fetch --all --tags
        VERSION_OLD="$({{.UV_RUN}} dunamai from git --format '{base}')"
        if [ -n "$(git status --porcelain pyproject.toml)" ]; then
          echo "You have uncommitted changes in pyproject.toml. Stopping."
          exit 1
        fi
        trap 'git restore -- pyproject.toml' 0
        uv version "$VERSION_OLD" --frozen
        uv version --bump "{{.PART}}" --frozen
        VERSION_NEW="$(uv version --short)"
        TAG_NEW="v$VERSION_NEW"
        if [ "{{.RELEASE}}" = "true" ]; then
          git tag --annotate --message="Bump from $VERSION_OLD to $VERSION_NEW" "$TAG_NEW"
        else
          git tag "$TAG_NEW"
        fi

  deploy-docs:
    desc: Deploy the documentation
    requires:
      vars: [ALIAS]
    vars:
      PUSH: '{{.PUSH | default "false"}}'
      VERSION_POSTFIX: '{{.VERSION_POSTFIX | default ""}}'
    cmds:
      - |
        VERSION="$({{.UV_RUN}} dunamai from git --format '{base}')"
        MAJOR="$(echo "$VERSION" | cut -d. -f1)"
        MINOR="$(echo "$VERSION" | cut -d. -f2)"
        PUSH_FLAG=""
        if [ "{{.PUSH}}" = "true" ]; then PUSH_FLAG="--force --push"; fi
        {{.UV_RUN}} mike deploy $PUSH_FLAG --no-redirect --update-aliases "$MAJOR.$MINOR{{.VERSION_POSTFIX}}" "{{.ALIAS}}"

  deploy-package:
    desc: Build and publish the package
    requires:
      vars: [USERNAME, PASSWORD]
    env:
      UV_PUBLISH_USERNAME: '{{.USERNAME}}'
      UV_PUBLISH_PASSWORD: '{{.PASSWORD}}'
    cmds:
      - |
        set -eu
        VERSION="$({{.UV_RUN}} dunamai from git --format '{base}')"
        if [ -n "$(git status --porcelain pyproject.toml)" ]; then
          echo "You have uncommitted changes in pyproject.toml. Stopping."
          exit 1
        fi
        trap 'git restore -- pyproject.toml' 0
        uv version "$VERSION" --frozen
        uv build
        uv publish

  push-latest-version-tag:
    desc: Push the latest version tag
    cmds:
      - 'git push origin v$({{.UV_RUN}} dunamai from git --format "{base}")'

  release:
    desc: Test, build, and publish a stable release
    requires:
      vars: [USERNAME, PASSWORD]
    cmds:
      - task: test
      - task: bump-version-tag
        vars:
          RELEASE: 'true'
      - task: docs
      - task: deploy-docs
        vars:
          PUSH: 'true'
          ALIAS: stable
      - '{{.UV_RUN}} mike set-default --push stable'
      - task: deploy-package
        vars:
          USERNAME: '{{.USERNAME}}'
          PASSWORD: '{{.PASSWORD}}'
      - task: push-latest-version-tag
