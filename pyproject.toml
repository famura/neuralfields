[project]
authors = [{name = "Fabio Muratore", email = "robot-learning@famura.net"}]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Natural Language :: English",
  "Programming Language :: Python :: 3",
]
dependencies = ["torch>=2"]
description = "A type of potential-based recurrent neural networks implemented with PyTorch"
license = "MIT"
maintainers = [{name = "Fabio Muratore", email = "robot-learning@famura.net"}]
name = "neuralfields"
readme = "README.md"
requires-python = ">=3.10,<4.0"
version = "0.0.0" # DO NOT MODIFY SINCE THE VERSIONS ARE AUTOMATICALLY GENERATED FROM GIT TAGS VIA DUNAMI

[project.urls]
Documentation = "https://famura.github.io/neuralfields"
Homepage = "https://github.com/famura/neuralfields"
Repository = "https://github.com/famura/neuralfields"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.hatch.build.targets.wheel]
packages = ["neuralfields"]

[dependency-groups]
dev = [
  "autoflake>=2.0.0,<3.0.0",
  "bandit[toml]>=1.7.4,<2.0.0",
  "black>=23.1.0,<24.0.0",
  "dunamai>=1.15.0,<2.0.0",
  "genbadge[coverage,tests]>=1.1.0,<2.0.0",
  "git-changelog>=2.10.0,<3.0.0",
  "isort[colors]>=9.0.2,<10.0.0",
  "mike>=2.2.0,<3.0.0",
  "mkdocs>=1.4.2,<2.0.0",
  "mkdocs-gen-files>=0.6.1,<0.7.0",
  "mkdocs-git-revision-date-localized-plugin>=1.1.0,<2.0.0",
  "mkdocs-literate-nav>=0.6.3,<0.7.0",
  "mkdocs-material>=9.7.7,<10.0.0",
  "mkdocs-minify-plugin>=0.8.0,<0.9.0",
  "mkdocstrings-python>=2.0.9,<3.0.0",
  "mypy>=2.4.0,<3.0.0",
  "pip-licenses>=5.5.5,<6.0.0",
  "pre-commit>=4.6.2,<5.0.0",
  "pylint>=4.1.3,<5.0.0",
  "pymdown-extensions<12.2",
  "pyqt5>=5.15.9,<6.0.0",
  "pytest>=9.1.1,<10.0.0",
  "pytest-cov>=7.1.0,<8.0.0",
  "pytest-html>=4.2.0,<5.0.0",
  "pyupgrade>=3.3.1,<4.0.0",
  "seaborn>=0.13.2,<0.14.0",
  "setuptools>=84.0.0,<85.0.0",
]

# ------------ #
# Tools Config #
# ------------ #

[tool.autoflake]
remove-all-unused-imports = true
remove-unused-variables = true

[tool.bandit]
exclude_dirs = [
  '.linting_reports',
  '.pytest_cache',
  '.venv',
]

[tool.black]
exclude = '''
/(
    \.eggs
  | \.git
  | \.github
  | \.linting_reports
  | \.mypy_cache
  | \.pytest_cache
  | \.site
  | \.venv
  | build
  | data
  | dist
)/
'''
include = '\.pyi?$|\.ipynb'
include_trailing_comma = true
line-length = 120

[tool.coverage.report]
fail_under = 67
show_missing = true
skip_empty = true

[tool.coverage.run]
branch = true
source = ["neuralfields"]

[tool.isort]
atomic = true
forced_separate = "neuralfields"
line_length = 120
lines_after_imports = 2
multi_line_output = 3
profile = "black"
use_parentheses = true

[tool.mypy]
exclude = [
  '.eggs',
  '.git/',
  '.github/',
  '.linting_reports/',
  '.mypy_cache/',
  '.pytest_cache/',
  '.site/',
  '.venv/',
  'build/',
  'data/',
  'dist/',
]
ignore_missing_imports = true # when no stubs are available, e.g. for matplotlib
pretty = false # uses too much vspace and degrades the legibitity of the report
show_column_numbers = true
show_error_codes = true
show_error_context = false
show_traceback = true

[tool.pylint.format]
max-args = 15
max-attributes = 10
max-line-length = 120

[tool.pylint.typecheck]
generated-members = ["numpy.*", "torch.*"] # list of members which are set dynamically to avoid E1101 error

[tool.pylint.logging]
logging-format-style = "new"

[tool.pylint.master]
fail-under = 8

[tool.pylint.messages_control]
disable = [
  'C0103', # snake case variable names
  'C0114', # missing module docstring
  'R0903', # too few public methods
  'R0911', # too many return statements
  'R1735', # use dict literal {} instead of dict()
  'W0105', # pointless stings
]

[tool.pylint.reports]
msg-template = "{path}:{line}: [{msg_id}({symbol}), {obj}] {msg}"
reports = 'no' # only print the message, not the complete report

[tool.pytest.ini_options]
addopts = [
  "--capture=tee-sys",
  "--full-trace",
  "--html=docs/exported/tests/report.html",
  "--junit-xml=pytest.xml",
  "--self-contained-html",
  "--showlocals",
  "--strict-markers",
  "-ra",
]
markers = [
  "slow: marks tests as time-intensive (deselect with '-m \"not slow\"')",
  "visual: marks tests that produce plots or animations (deselect with '-m \"not visual\"')",
]
pythonpath = [".", "neuralfields"]
testpaths = ["tests"]
