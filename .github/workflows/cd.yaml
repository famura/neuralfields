name: Continuous Deployment

on:
  push:
    branches: [main]
  workflow_dispatch:

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  cd:
    name: CD
    if: github.repository == 'famura/neuralfields'
    runs-on: ubuntu-latest
    permissions: # https://docs.github.com/en/actions/security-guides/automatic-token-authentication
      contents: write # to publish the docs to gh-pages
    env:
      os: ubuntu-latest
      python: "3.10"

    steps:
      - name: Install prerequisites
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install --yes curl gcc git

      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set up Task
        uses: go-task/setup-task@v2
        with:
          version: 3.x

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.9"
          python-version: "3.10"
          enable-cache: true

      - name: Configure git
        run: |
          git config user.name "${GITHUB_ACTOR}"
          git config user.email "${GITHUB_ACTOR}@users.noreply.github.com"

      - name: Install dependencies
        run: uv sync --locked

      - name: Bump patch version
        run: task bump-version-tag PART=patch

      - name: Deploy docs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          task test
          task docs
          task deploy-docs PUSH=true ALIAS=latest

      - name: Deploy package
        env:
          USERNAME: ${{ secrets.PYPI_USER }}
          PASSWORD: ${{ secrets.PYPI_TOKEN }}
        run: |
          task deploy-package

      - name: Push version tag
        run: task push-latest-version-tag

  release_draft:
    name: Update release notes
    runs-on: ubuntu-latest
    permissions: # https://docs.github.com/en/actions/security-guides/automatic-token-authentication
      contents: write

    steps:
      - uses: release-drafter/release-drafter@v5.22.0
        with:
          config-name: release_drafter.yaml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
